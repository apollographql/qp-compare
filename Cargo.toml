[package]
name = "qp-compare"
version = "0.1.0"
edition = "2024"

[lib]
name = "qp_compare"

[[bin]]
name = "qp-compare"
required-features = ["js"]

[features]
js = ["router-bridge", "tokio"]

[profile.release]
opt-level = 1  # Note: 2 or above seems to cause deno runtime errors.

[dependencies]
# Apollo internal dependencies
apollo-compiler = "1.31"
apollo-federation = "2.10"
router-bridge = { version = "=0.6.4+v2.9.3", optional = true }

# Other dependencies
clap = { version = "4", features = ["derive"] }
diff = "0.1"
once_cell = "1"
regex = "1"
serde = "1"
serde_json = "1"
serde_json_bytes = { version = "0.2", features = ["preserve_order"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tokio = { version = "1", features = ["full"], optional = true }
